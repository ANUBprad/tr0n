services:
  falkordb:
    image: falkordb/falkordb@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:3000:3000"
    environment:
      REDIS_ARGS: "--appendonly yes"
    volumes:
      - falkordb-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    profiles: ["app"]
    build: .
    environment:
      TRON_FALKOR_ADDR: falkordb:6379
      TRON_HTTP_ADDR: 0.0.0.0:8080
      TRON_GRAPH: ${TRON_GRAPH:-tron}
      TRON_OLLAMA_URL: http://ollama:11434
      TRON_OLLAMA_MODEL: ${TRON_OLLAMA_MODEL:-qwen3:4b-instruct}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped
  ollama:
    profiles: ["model"]
    image: ollama/ollama@sha256:5d3a2f25f9825628daba94dc0b1d421c7d57d6c03ae5faa9ba050e058bab8241
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    restart: unless-stopped
volumes:
  ollama-data:
  falkordb-data:
