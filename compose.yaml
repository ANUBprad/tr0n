services:
  falkordb:
    image: falkordb/falkordb@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:3000:3000"
    environment:
      REDIS_ARGS: "--appendonly yes"
    volumes:
      - falkordb-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    profiles: ["app"]
    build: .
    environment:
      TRON_FALKOR_ADDR: falkordb:6379
      TRON_HTTP_ADDR: 0.0.0.0:8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped
volumes:
  falkordb-data:
